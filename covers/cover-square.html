<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>朋友圈封面</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #6B8FAD;
    --orange: #C4A882;
    --bg: #F5F0EB;
    --dark: #1A1A1A;
    --gray: #6B6560;
    --light: #E8E3DD;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #D5CEC6;
    font-family: 'Noto Sans SC', 'Inter', sans-serif;
  }

  .cover {
    width: 383px;
    height: 383px;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }

  .bg-deco {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .circle-1 {
    position: absolute;
    top: -80px;
    right: -60px;
    width: 200px;
    height: 200px;
    border: 1px solid rgba(107, 143, 173, 0.12);
    border-radius: 50%;
  }

  .circle-2 {
    position: absolute;
    bottom: -70px;
    left: -40px;
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, rgba(107, 143, 173, 0.06) 0%, transparent 70%);
    border-radius: 50%;
  }

  .dots {
    position: absolute;
    top: 25px;
    right: 100px;
    display: grid;
    grid-template-columns: repeat(4, 6px);
    gap: 10px;
  }

  .dots span {
    width: 2.5px;
    height: 2.5px;
    background: rgba(107, 143, 173, 0.2);
    border-radius: 50%;
  }

  .crosshair {
    position: absolute;
    top: 40px;
    right: 60px;
    width: 16px;
    height: 16px;
  }

  .crosshair::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 1px;
    background: rgba(107, 143, 173, 0.25);
  }

  .crosshair::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 1px;
    background: rgba(107, 143, 173, 0.25);
  }

  .glow {
    position: absolute;
    top: 40%;
    right: 10%;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, rgba(107, 143, 173, 0.08) 0%, transparent 70%);
    border-radius: 50%;
  }

  .content {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 32px 32px 35px;
    z-index: 2;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-icon {
    width: 24px;
    height: 24px;
    background: var(--blue);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .brand-icon span {
    font-size: 11px;
    font-weight: 900;
    color: white;
  }

  .brand-text {
    font-size: 13px;
    font-weight: 700;
    color: #2D2D2D;
  }

  .date {
    font-size: 10px;
    font-weight: 500;
    color: var(--gray);
  }

  .main {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 11px;
    background: var(--light);
    border-radius: 14px;
    width: fit-content;
  }

  .tag-dot {
    width: 4px;
    height: 4px;
    background: var(--blue);
    border-radius: 50%;
  }

  .tag-text {
    font-size: 9px;
    font-weight: 600;
    color: var(--blue);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .title {
    font-size: 36px;
    font-weight: 900;
    color: #1A1A1A;
    line-height: 1.2;
    letter-spacing: -0.5px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }

  .title .blue {
    color: #4A7594;
    font-weight: 900;
  }

  .title .orange {
    color: #A88B6A;
  }

  .subtitle {
    font-size: 13px;
    font-weight: 500;
    color: #6B6560;
    line-height: 1.6;
  }

  .subtitle strong {
    color: #2D2D2D;
    font-weight: 700;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .footer-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .footer-line {
    width: 18px;
    height: 2px;
    background: var(--orange);
    border-radius: 1px;
  }

  .footer-text {
    font-size: 10px;
    font-weight: 600;
    color: var(--gray);
    letter-spacing: 1.5px;
  }

  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(to right, var(--blue), var(--orange));
    z-index: 3;
  }
</style>
</head>
<body>

<div class="cover">
  <div class="bg-deco">
    <div class="circle-1"></div>
    <div class="circle-2"></div>
    <div class="glow"></div>
    <div class="dots">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="crosshair"></div>
  </div>

  <div class="content">
    <div class="header">
      <div class="brand">
        <div class="brand-icon"><span>AI</span></div>
        <div class="brand-text">AI创享派</div>
      </div>
      <div class="date">2025.05.26</div>
    </div>

    <div class="main">
      <div class="tag">
        <div class="tag-dot"></div>
        <div class="tag-text">技巧与观点</div>
      </div>
      <h1 class="title">
        Claude Code<br>
        <span class="blue">自动模式</span><br>
        多任务并行技巧
      </h1>
      <p class="subtitle">
        Boris Cherny 分享高效秘诀
      </p>
    </div>

    <div class="footer">
      <div class="footer-left">
        <div class="footer-line"></div>
        <div class="footer-text">2025</div>
      </div>
    </div>
  </div>

  <div class="bottom-bar"></div>
</div>

</body>
</html>
